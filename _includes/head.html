<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; 
           img-src 'self' https://pcdomanual.com https://notbyai.fyi; 
           script-src 'self' https://umami.gustavoribeiro.net;
           connect-src 'self' https://umami.gustavoribeiro.net;"
/>

  <title>{{ page.title }} - {{ site.title }}</title>
  {% if page.description %}
    <meta name="description" content="{{ page.description | strip_html | strip_newlines | escape }}" />
  {% else %}
    <meta name="description" content="{{ site.description | strip_html | strip_newlines | escape }}" />
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ '/assets/style.css' | relative_url }}"
  />

  <link
    rel="icon"
    href="{{ '/assets/favicon.svg' | relative_url }}"
    type="image/svg+xml"
  />
  <link
    rel="icon"
    href="{{ '/assets/favicon.ico' | relative_url }}"
    sizes="32x32"
  />
  <link
    rel="apple-touch-icon"
    href="{{ '/assets/apple-touch-icon-180x180.webp' | relative_url }}"
  />
<script defer src="https://umami.gustavoribeiro.net/script.js" data-website-id="55882c71-663c-494f-8303-692244e1b180"></script>
<script defer src="https://umami.gustavoribeiro.net/recorder.js" data-website-id="55882c71-663c-494f-8303-692244e1b180"></script>
</head>
